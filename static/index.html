<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22a565">
<link rel="manifest" href="/static/manifest.json?v=2">
<link rel="icon" href="/static/icon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/static/icon-192.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180">
<meta name="apple-mobile-web-app-title" content="Bocado">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bocado · calorías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem('bocado:theme');if(_t&&_t!=='auto')document.documentElement.dataset.theme=_t}catch(e){}</script>
<style>
/* VOICE: sunny, upbeat, encouraging — a kitchen buddy you open three times a day
   IDEA: the day as a plate; meals fill it slot by slot like a lunch tray
   PICTURE: plate ring on a tangerine band; hand-made food icons mark every meal and macro
   COLOUR and TYPE: mint-green band, sunshine accent, coral for over-target, fresh mint ground; Nunito (rounded) + Inter
   LAYOUT: band (plate, macros) → meal slots → week; floating tab bar with camera button in the middle */
:root{color-scheme:light dark;
--bg:light-dark(#f3faf5,#0f1713);--card:light-dark(#ffffff,#18221c);--ink:light-dark(#14261c,#eaf5ee);--mute:light-dark(#5f7568,#9fb3a7);
--line:light-dark(#dcefe3,#26352c);--org:light-dark(#22a565,#2fb873);--orgd:light-dark(#178a52,#1f8f57);--sun:#ffc93c;--leaf:#3bb273;--berry:#ff7a59;--sky:#5b8def;
--band:linear-gradient(155deg,#3cc983 0%,#22a565 52%,#14917a 100%);
--bad:light-dark(#c2283c,#ff8a96);--sh:light-dark(0 2px 0 rgba(30,120,70,.08),0 0 0 1px rgba(255,255,255,.04));--sh2:light-dark(0 10px 30px rgba(20,110,60,.18),0 8px 30px rgba(0,0,0,.55))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.big{font-family:Nunito,"Noto Sans JP",Inter,sans-serif;font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
.ic{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.wrap{max-width:760px;margin:0 auto;width:100%}
/* band */
.band{background:var(--band);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) max(5vw,18px) 26px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,201,60,.28);top:-120px;right:-80px;pointer-events:none}
.band>.wrap{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:28px;display:flex;align-items:center;gap:8px}
.top h1 svg{width:30px;height:30px}
.top .meta{display:flex;align-items:center;gap:8px;font-size:14px}
.top .date{opacity:.9}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;color:var(--orgd);border-radius:99px;padding:3px 11px 3px 6px;font:800 15px Nunito,sans-serif;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.chip svg{width:22px;height:22px}
.chip.off{opacity:.75}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(16px,4vw,40px);align-items:center;margin-top:16px}
.plate{position:relative;aspect-ratio:1;max-width:300px;width:100%;margin:0 auto}
.plate>svg{width:100%;height:100%;display:block}
#arc{transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}
.pc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--ink)}
.pc .big{font-size:clamp(40px,10vw,54px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pc small{color:var(--mute);font-size:13px}
.pics{display:none;gap:4px;justify-content:center}
.pics svg{width:46px;height:46px}
body.out .pics{display:flex}body.out .pc .big,body.out .pc small{display:none}
.stats h2{font-size:clamp(26px,4.6vw,38px);margin-bottom:4px}
.stats p{margin:0 0 16px;opacity:.95}
.mac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mt{background:rgba(255,255,255,.2);border-radius:18px;padding:8px 10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;align-items:center}
.mt svg{width:30px;height:30px;grid-row:span 2;background:#fff;border-radius:50%;padding:3px}
.mt span{font-size:12px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt b{font:800 15px Nunito,"Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.mt b small{font-weight:600;opacity:.8}
.mt .bar{grid-column:1/-1;margin-top:8px}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .6s ease}
body.compact .hero{display:none}
body.compact .band{padding-bottom:18px}
body.out .mac,body.out .tabbar,body.out .chip{display:none}
/* layout */
main{padding:20px max(5vw,16px) calc(120px + env(safe-area-inset-bottom))}
section[hidden]{display:none}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:20px;margin-bottom:10px}
.sec{display:flex;align-items:center;gap:8px;font:800 15px Nunito,"Noto Sans JP",sans-serif;color:var(--ink);margin:24px 4px 10px}
.sec .ic{width:30px;height:30px;padding:6px;border-radius:10px;background:color-mix(in srgb,var(--org) 14%,transparent);color:var(--org)}
.muted{color:var(--mute);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input,select,textarea{width:100%;font:16px Inter,"Noto Sans JP",sans-serif;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--org);outline:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1}
button{font:700 16px Nunito,"Noto Sans JP",Inter,sans-serif;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;min-height:46px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button.on,button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button.on{background:var(--org);border-color:var(--org);color:#fff}
button.acc{background:var(--org);color:#fff;border-color:var(--org);box-shadow:0 4px 0 var(--orgd)}
button.acc:active{box-shadow:0 1px 0 var(--orgd);transform:translateY(3px)}
button.danger{color:var(--bad);border-color:currentColor;background:transparent;display:inline-flex;align-items:center;gap:6px}
button:disabled{opacity:.5;cursor:default}
button.x{min-height:38px;padding:6px 12px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--orgd);padding:6px 0;min-height:auto;font-weight:700;text-decoration:underline;cursor:pointer;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.msg{padding:10px 12px;border-radius:14px;background:light-dark(#fff1c9,#3a2f14);font-size:14px;margin-top:12px}
.err{color:var(--bad);font-size:14px;min-height:1em;margin:0}
/* meal slots */
.slot{background:var(--card);border-radius:24px;padding:8px 8px 8px 10px;margin-bottom:10px;box-shadow:var(--sh)}
.sh{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:56px}
.sic{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--c) 18%,var(--card));display:grid;place-items:center}
.sic svg{width:32px;height:32px}
.sh b{font:800 17px Nunito,"Noto Sans JP",sans-serif}
.sh .sk{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.sh .sk.has{color:var(--ink);font-weight:700}
.plus{width:44px;height:44px;padding:0;border-radius:50%;border:0;background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--ink);display:grid;place-items:center}
.plus svg{width:22px;height:22px}
.entry{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:8px 0;border-top:1.5px dashed var(--line);margin:0 2px 0 0}
.th{width:52px;height:52px;border-radius:16px;object-fit:cover;display:block}
div.th{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card))}
div.th svg{width:30px;height:30px;opacity:.85}
.en{font-size:15px;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.em{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.em b{color:var(--ink);font-weight:700}
.del{width:44px;height:44px;padding:0;border:0;background:none;color:var(--mute);display:grid;place-items:center;box-shadow:none}
.del svg{width:18px;height:18px}
/* week */
.wk{position:relative;height:130px;margin-top:22px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.wk .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.wk i{width:100%;max-width:30px;border-radius:10px 10px 5px 5px;background:light-dark(#bfe8d0,#1f4a33);min-height:4px}
.wk i.today{background:var(--org)}.wk i.over{background:var(--berry)}.wk i.zero{background:var(--line)}
.wk .v{position:absolute;bottom:calc(var(--h) + 4px);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl{position:absolute;left:0;right:0;border-top:2px dashed light-dark(rgba(43,29,20,.25),rgba(251,239,228,.3));pointer-events:none}
.tl span{position:absolute;right:0;top:-20px;font-size:11px;color:var(--mute);background:var(--card);padding:0 4px}
.wl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;text-align:center;font-size:12px;color:var(--mute);margin-top:6px}
.wl .t{color:var(--org);font-weight:800}
/* add */
.drop{display:grid;place-items:center;text-align:center;border:2.5px dashed light-dark(#a8dfc0,#2c5a40);border-radius:22px;min-height:220px;padding:16px;cursor:pointer;position:relative;overflow:hidden;background:light-dark(#eaf7ef,#131d17)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .dpics{display:flex;justify-content:center;gap:2px;margin-bottom:8px}
.drop .dpics svg{width:40px;height:40px}
.drop.scan::after{content:"";position:absolute;left:0;right:0;height:38%;top:-38%;background:linear-gradient(180deg,transparent,rgba(255,201,60,.55) 85%,#ffc93c);animation:scan 1.6s ease-in-out infinite;pointer-events:none}
.drop.scan::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:1;pointer-events:none}
@keyframes scan{to{top:100%}}
.rh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:8px}
.rh img{width:56px;height:56px;border-radius:16px;object-fit:cover}
.rh .tk{font:900 26px Nunito,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--org)}
.rh .tk small{font:500 13px Inter,sans-serif;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 4px;border-bottom:1.5px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input{min-height:40px;padding:6px 8px}
td input.g{width:76px;text-align:right}
td input.kt{width:80px;text-align:right;font-weight:700}
.addbox{margin-top:12px}
.addbox #results2:empty{display:none}
.addbox #results2{margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{flex:none;border-radius:99px;padding:6px 14px 6px 8px;min-height:42px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chips button svg{width:24px;height:24px}
.chips button.on{background:color-mix(in srgb,var(--c) 22%,var(--card));border-color:var(--c);color:var(--ink)}
/* settings */
.acct{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;flex:none;border-radius:50%;background:var(--band);color:#fff;display:grid;place-items:center;font:900 24px Nunito,sans-serif}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:light-dark(#e3f6ea,#173222);color:light-dark(#1e7a45,#7fd59e);margin-top:4px}
.formula{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.formula div{display:flex;justify-content:space-between;gap:12px;border-bottom:1.5px dashed var(--line);padding:4px 0}
.formula div:last-child{border:0;font-weight:800;font-size:18px;color:var(--org)}
.auth{max-width:440px;margin:0 auto}
.auth form{display:grid;gap:14px}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;
background:light-dark(rgba(255,255,255,.94),rgba(24,36,29,.94));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;box-shadow:var(--sh2);height:66px;z-index:20}
.tabbar a{display:grid;justify-items:center;gap:2px;color:var(--mute);text-decoration:none;font:700 12px Nunito,"Noto Sans JP",sans-serif;padding:8px 0}
.tabbar a svg{width:26px;height:26px}
.tabbar a[aria-current=page]{color:var(--org)}
.fab{position:relative;justify-self:center;width:68px;height:68px;margin-top:-22px;border-radius:50%;background:var(--band);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(34,165,101,.45);cursor:pointer;border:4px solid var(--bg)}
.fab svg{width:30px;height:30px}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(110px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 65%);pointer-events:none;z-index:15}
body.out::after{display:none}
.fab input{position:absolute;inset:0;opacity:0;cursor:pointer;border-radius:50%}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:18px;font:700 15px Nunito,sans-serif;transition:.25s;z-index:30;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.drop.scan::after,.spin{animation:none}}
@media(max-width:600px){.hero{grid-template-columns:1fr;gap:10px}.plate{max-width:230px}.stats{text-align:center}.grid{grid-template-columns:1fr}.top .date{display:none}
.mt{grid-template-columns:1fr;justify-items:center;text-align:center;padding:8px 6px 10px}.mt svg{grid-row:auto;margin-bottom:2px}.mt .bar{width:100%}
table{font-size:14px}td input.g,td input.kt{width:62px}.hide-s{display:none}}

/* add view: modes, search results, scanner, favourites */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.modes.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.modes button{display:grid;justify-items:center;gap:4px;padding:10px 4px;min-height:70px;font-size:13px;border-radius:18px;box-shadow:var(--sh);border:0}
.modes button svg{width:24px;height:24px}
.modes button.on{background:var(--org);color:#fff}
.modes button[hidden]{display:none}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1.5px dashed var(--line)}
.res:last-child{border:0}
.res b{font-weight:600;font-size:15px;display:block;overflow-wrap:anywhere}
.res small{display:block;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.fadd{width:44px;height:44px;padding:0;border-radius:50%;border:0;background:color-mix(in srgb,var(--org) 16%,var(--card));color:var(--orgd);display:grid;place-items:center;box-shadow:none}
.fadd svg{width:20px;height:20px}
.fadd.ok{background:var(--org);color:#fff}
.scanbtn{display:grid;justify-items:center;text-align:center;gap:4px;border:2.5px dashed light-dark(#a8dfc0,#2c5a40);border-radius:22px;padding:24px 16px;position:relative;cursor:pointer;background:light-dark(#eaf7ef,#131d17)}
.scanbtn svg{width:44px;height:44px;color:var(--org)}
.scanbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.empty2{color:var(--mute);font-size:14px;padding:8px 0}
/* meal detail sheet */
.entry{cursor:pointer;border-radius:14px;transition:background .15s}
.entry:hover{background:color-mix(in srgb,var(--org) 6%,transparent)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,30,20,.45);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain;touch-action:none}
.sheet[hidden]{display:none}
.sbox{background:var(--card);width:min(560px,100%);max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.sheet{align-items:center}.sbox{border-radius:28px}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.shd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.shd .ph{width:88px;height:88px;border-radius:20px;object-fit:cover;display:block}
.shd div.ph{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--card))}
.shd div.ph svg{width:52px;height:52px}
.shd h3{font-size:22px;margin:0}
.shd .muted{margin-top:2px}
.shd .tk{font:900 28px Nunito,sans-serif;color:var(--org);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.shd .tk small{display:block;font:500 12px Inter,sans-serif;color:var(--mute)}
.smac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 6px}
.smac>div{background:var(--bg);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.smac>div>div{min-width:0}
.smac svg{width:28px;height:28px;flex:none}
.smac span{font-size:12px;color:var(--mute);display:block;line-height:1.2}
.smac b{font:800 16px Nunito,sans-serif;font-variant-numeric:tabular-nums}
.sit{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.sit:last-child{border:0}
.sit b{font-weight:600;font-size:15px;display:block;overflow-wrap:anywhere}
.sit small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.sit .gw{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
.sit input{width:68px;min-height:40px;padding:6px 8px;text-align:right}
.sit input[data-sk]{font-weight:700}
.sit .kc{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.sact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sact button{flex:1;min-width:140px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sact button[hidden]{display:none}
.sact svg{width:18px;height:18px}
/* share */
.shlink{display:flex;gap:8px;align-items:center}
.shlink input{flex:1;font-weight:600;color:var(--orgd)}
.code{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:12px}
.code b{font:800 18px Nunito,monospace;letter-spacing:.04em}
.qr{display:grid;justify-items:center;gap:6px;margin-top:14px}
.qr canvas,.qr img{width:180px;height:180px;image-rendering:pixelated;background:#fff;padding:10px;border-radius:16px}
/* login: tilted tile wall + centred card */
body.out .band,body.out .tabbar,body.out #storeNote{display:none}
body.out main{padding:0;max-width:none}
#authBg{position:fixed;inset:0;overflow:hidden;z-index:0;display:none;background:var(--bg)}
body.out #authBg{display:block}
.tiles{position:absolute;left:50%;top:50%;width:1500px;display:flex;gap:26px;transform:translate(-50%,-50%) rotate(-9deg)}
.tcol{flex:1;display:flex;flex-direction:column;gap:26px}
.tile{height:var(--h);border-radius:30px;background-color:var(--c);position:relative;overflow:hidden}
.tile svg{position:absolute;width:74px;height:74px;right:22px;bottom:20px;transform:rotate(9deg);opacity:.95}
.p-dots{background-image:radial-gradient(rgba(255,255,255,.4) 17%,transparent 18%);background-size:30px 30px}
.p-stripes{background-image:repeating-linear-gradient(120deg,rgba(255,255,255,.2) 0 16px,transparent 16px 38px)}
.p-rings{background-image:repeating-radial-gradient(circle at 85% 95%,rgba(255,255,255,.24) 0 12px,transparent 12px 28px)}
.p-bubbles{background-image:radial-gradient(circle at 18% 28%,rgba(255,255,255,.35) 0 26px,transparent 27px),radial-gradient(circle at 62% 62%,rgba(255,255,255,.28) 0 16px,transparent 17px),radial-gradient(circle at 40% 85%,rgba(255,255,255,.3) 0 10px,transparent 11px)}
:root[data-theme=dark] #authBg .tiles{filter:brightness(.55) saturate(.9)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #authBg .tiles{filter:brightness(.55) saturate(.9)}}
#v-auth{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#v-auth[hidden]{display:none}
.auth{width:100%;max-width:420px;border-radius:32px;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(10,60,35,.28);margin:0}
.ahero{display:block;width:230px;height:160px;margin:-6px auto 4px}
.brand{display:flex;align-items:center;gap:10px;font:900 42px/1 Nunito,sans-serif;letter-spacing:-.02em;margin:0 0 8px}
.brand svg{width:46px;height:46px;background:var(--band);border-radius:50%;padding:3px}
.brand em{font-style:italic;color:var(--org);font-weight:800}
.atag{color:var(--mute);font-size:16px;margin:0 0 18px;line-height:1.5}
.auth h3{font-size:13px;font-family:Inter,sans-serif;font-weight:700;letter-spacing:.02em;color:var(--mute);margin:0 0 10px}
.auth button.acc{width:100%;min-height:52px;font-size:17px}
.auth .linkbtn{display:block;margin:12px auto 0}
</style>

/* ---------- API ---------- */
async function api(path,{method='GET',body,form,signal}={}){
  const o={method,credentials:'same-origin',headers:{},signal};
  if(form)o.body=form;else if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(path,o);let j=null;try{j=await r.json()}catch{}
  if(r.status===401&&!/\/api\/(login|register)$/.test(path)){showAuth();throw {code:'auth'}}
  if(!r.ok)throw {code:j?.error||'x',status:r.status};
  return j;
}

/* ---------- calculation ---------- */
function calc(p){
  if(!p||!p.sexo||!p.edad||!p.peso||!p.alt)return null;
  const bmr=10*p.peso+6.25*p.alt-5*p.edad+(p.sexo==='h'?5:-161);
  const tdee=bmr*p.act, raw=tdee+Number(p.obj), floor=Math.max(bmr,1200), meta=Math.max(raw,floor);
  const prot=(Number(p.obj)<0?1.8:1.6)*p.peso, grasa=meta*0.28/9, carb=Math.max(0,(meta-prot*4-grasa*9)/4);
  return {bmr,tdee,meta,adj:raw<floor,prot,grasa,carb};
}
const itemK=i=>i.g*i.k/100;
const mealK=m=>m.items.reduce((a,i)=>a+itemK(i),0);
const dayTot=ms=>(ms||[]).reduce((a,m)=>{m.items.forEach(i=>{a.k+=itemK(i);a.p+=i.g*(i.p||0)/100;a.c+=i.g*(i.c||0)/100;a.f+=i.g*(i.f||0)/100});return a},{k:0,p:0,c:0,f:0});
const mealName=k=>{const i=MEALK.indexOf(k);return i<0?k:T().meals[i]};
const profile=()=>S.me?.profile||null;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

/* ---------- render ---------- */
function renderTop(){
  if(!S.me){$('eaten').textContent='0';$('headline').textContent=t('welcome');$('sub').textContent=t('welcomeSub');$('mac').innerHTML='';return}
  const c=calc(profile()), x=dayTot(S.day.meals), C=2*Math.PI*85;
  $('eaten').textContent=fmt(x.k);
  if(!c){$('ofk').textContent=t('eatenToday');$('arc').setAttribute('stroke-dasharray','0 999');$('mac').innerHTML='';$('headline').textContent=t('noProf');$('sub').textContent=t('noProfSub');return}
  const pct=Math.min(1,x.k/c.meta), left=c.meta-x.k;
  $('arc').setAttribute('stroke-dasharray',`${(pct*C).toFixed(1)} ${C}`);
  $('arc').setAttribute('stroke',x.k>c.meta?'var(--berry)':'var(--org)');
  $('ofk').textContent=t('of',{n:fmt(c.meta)});
  $('headline').textContent=left>=0?t('left',{n:fmt(left)}):t('over',{n:fmt(-left)});
  $('sub').textContent=left>=0?t('subLeft'):t('subOver');
  const M=[[x.p,c.prot],[x.c,c.carb],[x.f,c.grasa]];
  $('mac').innerHTML=M.map(([v,g],i)=>`<div class="mt">${IC(['i-p','i-c','i-f'][i])}<span>${esc(T().mac[i])}</span><b>${r0(v)}<small> / ${r0(g)} g</small></b><div class="bar"><i style="width:${Math.min(100,v/g*100)}%"></i></div></div>`).join('');
}

function renderWeek(){
  const c=calc(profile()), days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const vals=days.map(d=>{const k=dkey(d);return dayTot(k===TODAY?S.day.meals:S.hist[k]).k});
  const max=Math.max((c?.meta||0)*1.15,...vals,1);
  $('wk').innerHTML=days.map((d,i)=>{const v=vals[i],h=Math.max(3,v/max*100),k=dkey(d);
    const cls=!v?'zero':(c&&v>c.meta?'over':(k===TODAY?'today':''));
    return `<div class="col" style="--h:${h}%"><span class="v">${v?r0(v):''}</span><i class="${cls}" style="height:${h}%"></i></div>`}).join('')
    +(c?`<div class="tl" style="bottom:${c.meta/max*100}%"><span>${t('targetLbl')} ${fmt(c.meta)}</span></div>`:'');
  $('wl').innerHTML=days.map(d=>`<span class="${dkey(d)===TODAY?'t':''}">${T().days[d.getDay()]}</span>`).join('');
}

async function draw(f,max,square){
  const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
  let sx=0,sy=0,sw=bmp.width,sh=bmp.height;
  if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
  const s=Math.min(1,max/Math.max(sw,sh));
  const c=document.createElement('canvas');c.width=Math.round(sw*s);c.height=Math.round(sh*s);
  c.getContext('2d').drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);return c;
}
async function shrink(f){try{const c=await draw(f,1600,false);return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.85))}catch{return f}}

  finally{$('analyze').disabled=false;$('cancel').hidden=true;$('status').textContent='';$('drop').classList.remove('scan')}
}

async function decodeBarcode(file){

  }
  const Z=await loadZXing();const url=URL.createObjectURL(file);
  try{const r=await new Z.BrowserMultiFormatReader().decodeFromImageUrl(url);return r.getText()}finally{URL.revokeObjectURL(url)}
}

  if(!items.length||!name){$('aiNote').textContent=tErr('bad_fav');return}
  try{await api('/api/favorites',{method:'POST',body:{name,items}});$('favForm').hidden=true;toast(t('favSaved'));S.favs=null}
  catch(e){$('aiNote').textContent=tErr(e.code)}
};


/* ---------- share ---------- */
const appUrl=()=>location.origin;
function shareMsg(){return S.me?.invite?t('shareMsgA',{u:appUrl(),c:S.me.invite}):t('shareMsgU',{u:appUrl()})}
function renderShare(){
  if(!S.me)return;
  $('shUrl').value=appUrl();
  const admin=!!S.me.is_admin, code=S.me.invite;
  $('shareDesc').textContent=admin?t('shareDescA'):t('shareDescU');
  $('codeBox').hidden=!(admin&&code);$('codeVal').textContent=code||'';
  $('noInvite').hidden=!(admin&&!code);
  $('shareBtn').hidden=!navigator.share;
  drawQR();
}
let qrP=null;
function loadQR(){
  if(window.qrcode)return Promise.resolve(window.qrcode);
  return qrP||(qrP=new Promise((ok,no)=>{const sc=document.createElement('script');
    sc.src='/static/qrcode.js';sc.onload=()=>ok(window.qrcode);sc.onerror=no;document.head.appendChild(sc)}));
}
async function drawQR(){
  try{const q=await loadQR();const qr=q(0,'M');qr.addData(appUrl());qr.make();
    $('qr').innerHTML=qr.createImgTag(6,0);$('qr').querySelector('img').alt='QR: '+appUrl();$('qrBox').hidden=false}
  catch{$('qrBox').hidden=true}
}
async function copyText(txt,btn){
  try{await navigator.clipboard.writeText(txt)}
  catch{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch{}ta.remove()}
  toast(t('copied'));
}
$('copyLink').onclick=()=>copyText(appUrl());
$('copyCode').onclick=()=>copyText(S.me?.invite||'');
$('copyMsg').onclick=()=>copyText(shareMsg());
$('shareBtn').onclick=async()=>{try{await navigator.share({title:'Bocado',text:shareMsg()})}catch{}};

/* ---------- theme ---------- */
function renderTheme(){const th=lsGet('theme')||'auto';document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.th===th))}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{
  const th=b.dataset.th;lsSet('theme',th);
  if(th==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=th;
  renderTheme();
});

function showDraft(items,title){
  S.draft=items;$('resTitle').textContent=title;$('aiNote').textContent='';$('resImg').hidden=!S.file;
  $('resCard').hidden=false;renderChips();renderDraft();$('resCard').scrollIntoView({behavior:'smooth',block:'start'});
}
function totDraft(){$('tot').innerHTML=`${fmt(S.draft.reduce((a,i)=>a+itemK(i),0))}<small> kcal</small>`}
function renderDraft(){
  $('rows').innerHTML=S.draft.map((i,x)=>`<tr><td><input data-x="${x}" data-f="n" list="foodNames" value="${esc(i.n)}" aria-label="${esc(t('thFood'))}"></td>
   <td class="n"><input class="g" type="number" inputmode="numeric" min="0" data-x="${x}" data-f="g" value="${i.g}" aria-label="${esc(t('thG'))}"></td>
   <td class="n hide-s"><input class="g" type="number" inputmode="decimal" min="0" data-x="${x}" data-f="k" value="${i.k}" aria-label="kcal/100 g"></td>
   <td class="n"><input class="kt" type="number" inputmode="numeric" min="0" data-x="${x}" data-f="kt" id="k${x}" value="${r0(itemK(i))}" aria-label="kcal"></td><td><button class="del" data-rm="${x}" aria-label="${esc(t('del'))}">${IC('u-x')}</button></td></tr>`).join('');
  totDraft();
}
$('rows').addEventListener('input',e=>{const el=e.target,x=+el.dataset.x,f=el.dataset.f,it=S.draft[x];if(!it)return;
  if(f==='n'){it.n=el.value;
    // picked a known food from the suggestions -> take its values so grams drive the kcal
    const hit=(FOODS||[]).find(fd=>[fd.en,fd.es,fd.ja].some(v=>norm(v)===norm(el.value)));
    if(hit){const tr=el.closest('tr');it.k=hit.k;it.p=hit.p;it.c=hit.c;it.f=hit.f;
      if(!it.g){it.g=hit.g;tr.querySelector('[data-f=g]').value=hit.g}
      const ki=tr.querySelector('[data-f=k]');if(ki)ki.value=hit.k;$('k'+x).value=r0(itemK(it));totDraft()}
    return}
  const v=Math.max(0,+el.value||0);
  if(f==='kt'){
    // total kcal typed by hand -> derive kcal/100 g (macros scale with it if they were known)
    if(!it.g){it.g=100;const gi=el.closest('tr').querySelector('[data-f=g]');if(gi)gi.value=100}
    const nk=v*100/it.g, ratio=it.k>0?nk/it.k:0;
    it.p=(it.p||0)*ratio;it.c=(it.c||0)*ratio;it.f=(it.f||0)*ratio;it.k=nk;
    const ki=el.closest('tr').querySelector('[data-f=k]');if(ki)ki.value=Math.round(nk*10)/10;
  }else{
    it[f]=v;$('k'+x).value=r0(itemK(it));
  }
  totDraft()});
$('rows').addEventListener('click',e=>{const x=e.target.closest('button')?.dataset.rm;if(x!=null){S.draft.splice(+x,1);renderDraft()}});
$('addRow').onclick=()=>{loadFoods();S.draft.push({n:'',g:100,k:0,p:0,c:0,f:0});renderDraft();$('rows').lastElementChild.querySelector('input').focus()};
$('q2').addEventListener('focus',()=>loadFoods());
$('q2').addEventListener('input',async()=>{await loadFoods();const q=$('q2').value.trim();$('results2').innerHTML=q?foodListHTML(q,6):''});
$('results2').onclick=e=>{const b=e.target.closest('button[data-food]');if(!b)return;const f=FOODS[+b.dataset.food];S.draft.push({n:fname(f),g:f.g,k:f.k,p:f.p,c:f.c,f:f.f});renderDraft();b.classList.add('ok');setTimeout(()=>b.classList.remove('ok'),700);toast(t('added',{n:fname(f)}))};
$('save').onclick=async()=>{
  const items=S.draft.filter(i=>String(i.n).trim()&&i.g>0);if(!items.length)return;
  const d=new Date();$('save').disabled=true;
  try{
    const m=await api('/api/meals',{method:'POST',body:{day:TODAY,tipo:S.mtype,hora:`${pad(d.getHours())}:${pad(d.getMinutes())}`,items,thumb:S.thumb}});
    S.day.meals.push(m);
    if(S.day.meals.length===1)api('/api/streak').then(st=>{S.streak=st.streak;renderStreak()}).catch(()=>{});
    resetAdd();$('analyze').textContent=t('calc');renderAll();location.hash='hoy';
    const c=calc(profile());
    if(c){const left=c.meta-dayTot(S.day.meals).k;toast(left>=0?t('savedLeft',{n:fmt(left)}):t('savedOver',{n:fmt(-left)}))}else toast(t('saved'));
  }catch(e){$('aiNote').textContent=tErr(e.code)}
  finally{$('save').disabled=false}
};


/* ---------- login tile wall ---------- */
(function(){
  const C=['#9fd8b9','#f7d77a','#f4a68f','#a9c1ef','#e8c49a','#f1a7b3','#b9d98a','#8fd0c9'];
  const PT=['p-dots','p-stripes','p-rings','p-bubbles'];
  const IC2=['i-b','i-l','i-m','i-d','i-s','i-p','i-c','i-f'];
  let k=0,html='';
  for(let c=0;c<6;c++){
    html+=`<div class="tcol" style="margin-top:${[-120,40,-60,90,-20,60][c]}px">`;
    for(let r=0;r<6;r++){k++;
      const ic=(k*5)%3===0?`<svg aria-hidden="true"><use href="#${IC2[k%IC2.length]}"/></svg>`:'';
      html+=`<div class="tile ${PT[(k*3+c)%PT.length]}" style="--c:${C[(k*7+c)%C.length]};--h:${[190,250,210,280,230][(k+c)%5]}px">${ic}</div>`;
    }
    html+='</div>';
  }
  document.getElementById('tiles').innerHTML=html;
})();

S.lang=L[lsGet('lang')]?lsGet('lang'):'en';
applyLang();
(async()=>{try{await enter(await api('/api/me'))}catch(e){if(e.code!=='auth')showAuth()}})();
}
